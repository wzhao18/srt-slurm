name: "kimi-k3-nvfp4-5p1d-dcp8-dep32-dspark4-megamoe-agentx"

model:
  path: "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/models/kimi-k3-nvfp4-model"
  container: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/images/pytorch+25+12+py3.sqsh"
  precision: "nvfp4"

identity:
  model:
    repo: "nvidia/Kimi-K3-NVFP4"
  container:
    image: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/images/pytorch+25+12+py3.sqsh"
  frameworks:
    dynamo: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"
    vllm: 2ea21c22a1aaef70607977b8fff40de917d6f704

extra_mount:
  - "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha:/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha"
  - "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/models/kimi-k3-dspark-model:/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/models/kimi-k3-dspark-model"
  - "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm:/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm"
  - "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/flashinfer:/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/flashinfer"
  - "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/InferenceX:/infmax-workspace"
  - "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/.cache/aiperf:/aiperf_mmap_cache"
  - "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/.cache/huggingface/hub:/hf_hub_cache"

dynamo:
  hash: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"
  install: false

# srtctl launches mooncake_master with no env, so the binary must be on the
# stock container PATH; this symlinks it from the lustre venv.
setup_script: "venv-mooncake-path.sh"

slurm:
  account: "coreai_comparch_inferencex"
  partition: "batch"
  time_limit: "04:00:00"

health_check:
  max_attempts: 720
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
  prefill_nodes: 10
  decode_nodes: 8
  prefill_workers: 5
  decode_workers: 1
  gpus_per_prefill: 8
  gpus_per_decode: 32

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "least-loaded"
    router-session-affinity-ttl-secs: 900
  env:
    PATH: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv/bin:/usr/local/lib/python3.12/dist-packages/torch_tensorrt/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/mpi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ucx/bin:/opt/amazon/efa/bin:/opt/tensorrt/bin:/opt/mellanox/doca/tools/"
    VIRTUAL_ENV: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv"
    LD_LIBRARY_PATH: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv/lib/python3.12/site-packages/torch/lib:/usr/local/cuda/compat/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64"
    PYTHONPYCACHEPREFIX: "/tmp/vllm-pycache-kimi-k3"
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
    DYN_TOKENIZER_CACHE_BYTES: "8589934592"
backend:
  type: vllm
  connector: null
  dp_launch_mode: per_node
  kv_events_config:
    prefill: true
  mooncake_kv_store:
    master_extra_args:
      - "--default_kv_lease_ttl=60000"
      - "--eviction_high_watermark_ratio=0.95"
      - "--eviction_ratio=0.10"
    store_config:
      metadata_server: "P2PHANDSHAKE"
      # Per rank: four ranks per node reserve 640 GB of the node's 918 GB.
      global_segment_size: "160GB"
      local_buffer_size: "4GB"
      protocol: "rdma"
      device_name: "rdma_vf_rail0,rdma_vf_rail1,rdma_vf_rail2,rdma_vf_rail3"
      mode: "embedded"
      enable_offload: false
  prefill_environment: &kimi_env
    VLLM_TOKENSPEED_MLA_MIN_SPLIT_KV: "8"
    PATH: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv/bin:/usr/local/lib/python3.12/dist-packages/torch_tensorrt/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/mpi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ucx/bin:/opt/amazon/efa/bin:/opt/tensorrt/bin:/opt/mellanox/doca/tools/"
    VIRTUAL_ENV: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv"
    LD_LIBRARY_PATH: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv/lib/python3.12/site-packages/torch/lib:/usr/local/cuda/compat/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64"
    # Use direct symmetric-memory DCP collectives on the rebuilt runtime.
    VLLM_USE_DIRECT_DCP_A2A: "1"
    VLLM_USE_DIRECT_DCP_Q_GATHER: "1"
    VLLM_USE_DIRECT_DCP_KV_GATHER: "1"
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    # No-op in this recipe: shard_sequence_parallel_mlp needs sequence
    # parallelism, which needs enable_expert_parallel -- off on both roles'
    # attention path here (prefill has no EP; decode is TP=1).
    VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "0"
    DYN_REQUEST_PLANE: "tcp"
    ETCD_LEASE_TTL: "600"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_RPC_TIMEOUT: "600000"
    TILELANG_CLEANUP_TEMP_FILES: "1"
    VLLM_USE_NCCL_SYMM_MEM: "0"
    # TORCH_SYMMMEM deliberately NOT set to NVSHMEM here.
    # MegaMoE (decode role) allocates its symm buffer with device='cuda' (no
    # index, deep_gemm/mega/__init__.py:48) and calls symm_mem.rendezvous. On
    # the NVSHMEM backend that reaches a process-global TeamManager singleton
    # pinned to the first caller's device (nvshmem_team_manager.hpp:36-44), so a
    # TP>1 engine whose workers span devices 0-3 dies with
    #   "Detected use of TeamManager on multiple devices."
    # Measured: fine at TP=1 (DEP16 decode, job 2649641), fails at TP>1 (job
    # 2649921 prefill). Leaving it unset selects torch's default CUDA symm-mem
    # backend, which has no such singleton.
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_MOONCAKE_LOAD_RECV_THREADS: "4"
    MC_SLICE_SIZE: "1048576"
    VLLM_CONNECTOR_PREFETCH_DEPTH: "8"
    VLLM_CONNECTOR_PREFETCH_KV_CAP: "0.65"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    NVSHMEM_IB_ENABLE_IBGDA: "1"
    NVSHMEM_ENABLE_NIC_PE_MAPPING: "1"
    NVSHMEM_HCA_LIST: "rdma_vf_rail0,rdma_vf_rail1,rdma_vf_rail2,rdma_vf_rail3"
    NCCL_P2P_LEVEL: NVL
    MC_ENABLE_DEST_DEVICE_AFFINITY: "1"
    WITH_NVIDIA_PEERMEM: "0"
    MC_MAX_MR_SIZE: "4294967296"
    # NIXL (venv wheel) bundles its own UCX; NCCL's rdma_sharp_plugin loads
    # /opt/hpcx UCX. Both in one process share UCM memory hooks and corrupt the
    # heap -- NixlConnector then dies with
    #   nixl_agent.cpp:470 registerMem: registration failed ... NIXL_ERR_BACKEND
    # (and a "corrupted size vs. prev_size" abort at teardown). Disabling the
    # external NCCL net plugin leaves exactly one UCX in the process; NCCL falls
    # back to its built-in IB/NVLink transports. Verified on theia0263: 4 ranks,
    # hpcx libs mapped = 0, 93-region registerMem OK on every rank.
    NCCL_NET_PLUGIN: "none"
    # UCX_MEMTYPE_CACHE=n stops UCX misclassifying a CUDA pointer it did not
    # allocate as host memory; REG_WHOLE=n keeps it from registering the whole
    # enclosing region instead of the requested range.
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_RCACHE_MAX_UNRELEASED: "1024"
    UCX_TCP_AF_PRIO: "inet"
    UCX_NET_DEVICES: "rdma_vf_rail0:1,rdma_vf_rail1:1,rdma_vf_rail2:1,rdma_vf_rail3:1"
    # K3's linear-attention layers hold Mamba conv state. NixlConnector's
    # 3-read conv transfer asserts the DS (dim, state_len) layout at worker
    # init; without this both roles die with "requires DS conv state layout".
    # Must match on prefill and decode, hence the shared anchor.
    VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  decode_environment:
    VLLM_TOKENSPEED_MLA_MIN_SPLIT_KV: "8"
    <<: *kimi_env

  vllm_config:
    prefill:
      # MultiConnector: Nixl (P->D handshake transfer) + Mooncake (external DRAM KV).
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlPushConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      served-model-name: "nvidia/Kimi-K3-NVFP4"
      prefix-match-unit: 128
      load-format: fastsafetensors
      enable-flashinfer-autotune: true
      kv-cache-dtype: fp8
      mamba-cache-mode: align
      mamba-ssm-cache-dtype: bfloat16
      gpu-memory-utilization: 0.92
      tensor-parallel-size: 8
      # The point of this recipe: DCP reuses the 8 TP ranks and shards the MLA
      # KV cache across them instead of replicating it, giving the prefill role
      # ~7.5x the KV pool it has under plain TP8.
      decode-context-parallel-size: 8
      cp-kv-cache-interleave-size: 64
      dcp-comm-backend: a2a
      enable-cumem-allocator: true
      trust-remote-code: true
      max-cudagraph-capture-size: 512
      stream-interval: 10
      language-model-only: true
      attention-backend: "TOKENSPEED_MLA"
      attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization": true}'
      speculative-config: '{"model":"/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/models/kimi-k3-dspark-model","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"rejection_sample_method":"synthetic","synthetic_acceptance_length":3.36}'
      enable-prefix-caching: true
      prefix-cache-retention-interval: 35840
    decode:
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlPushConnector","kv_role":"kv_both","kv_load_failure_policy":"fail","kv_buffer_device":"cuda","kv_connector_extra_config":{"enforce_handshake_compat":false,"enable_cross_layers_blocks":false}},{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_consumer","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_lookup":false,"enable_cross_layers_blocks":false,"enable_offload":false}}]}}'
      enable-prefix-caching: true
      prefix-cache-retention-interval: 32000
      served-model-name: "nvidia/Kimi-K3-NVFP4"
      prefix-match-unit: 128
      load-format: fastsafetensors
      enable-flashinfer-autotune: true
      kv-cache-dtype: fp8
      mamba-cache-mode: align
      mamba-ssm-cache-dtype: bfloat16
      gpu-memory-utilization: 0.92
      tensor-parallel-size: 1
      data-parallel-size: 32
      data-parallel-rpc-port: 13345
      enable-expert-parallel: true
      enable-ep-weight-filter: true
      moe-backend: flashinfer_moe_ep_cutedsl
      enable-cumem-allocator: true
      trust-remote-code: true
      max-cudagraph-capture-size: 512
      max-num-seqs: 32
      max-num-batched-tokens: 512
      stream-interval: 10
      language-model-only: true
      attention-backend: "TOKENSPEED_MLA"
      attention-config: '{"mla_prefill_backend": "TRTLLM_RAGGED", "use_prefill_query_quantization": true}'
      speculative-config: '{"model":"/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/models/kimi-k3-dspark-model","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"rejection_sample_method":"synthetic","synthetic_acceptance_length":3.36}'

sbatch_directives:
  mem: "0"
  cpus-per-task: "72"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  type: custom
  client_placement: head
  concurrencies: [128, 192, 256]
  command: "bash /configs/agentic_srt_offline.sh"
  env:
    AIPERF_UV_CACHE_ARCHIVE: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.cache/aiperf-uv.tar.gz"
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    AGENTIC_OUTPUT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "true"
    DISAGG: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_DYNAMO_SESSION_TIMEOUT_SECONDS: "14400"
    MODEL: "nvidia/Kimi-K3-NVFP4"
    MODEL_PATH: "/model"
    MODEL_PREFIX: "kimi-k3"
    FRAMEWORK: "dynamo-vllm"
    PRECISION: "nvfp4"
    CONC: "128"
    CONC_LIST: "128 192 256"
    DURATION: "1800"
    RESULT_FILENAME: "kimi-k3_nvfp4_dynamo-vllm_5p1d_dcp8_dep32_dspark4_megamoe_min8_tokenspeed-mla_mooncake"
    # Total GPUs: 5 * 8 prefill + 32 decode = 72 (NVL72 cap).
    PREFILL_NUM_WORKERS: "5"
    PREFILL_TP: "8"
    PREFILL_EP: "1"
    # benchmark_lib.sh:1097 reads PREFILL_DCP_SIZE into the result JSON's
    # prefill_dcp_size, which is what labels the series DCP8 rather than TP8.
    PREFILL_DCP_SIZE: "8"
    PREFILL_DP_ATTENTION: "false"
    DECODE_NUM_WORKERS: "1"
    DECODE_TP: "32"
    DECODE_EP: "32"
    DECODE_DCP_SIZE: "1"
    DECODE_DP_ATTENTION: "true"
    KV_OFFLOADING: "dram"
    KV_OFFLOAD_BACKEND: "mooncake"
    KV_OFFLOAD_BACKEND_METADATA: '{"name":"mooncake","version":"0.3.13.post1"}'
    TOTAL_CPU_DRAM_GB: "150"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
    WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
