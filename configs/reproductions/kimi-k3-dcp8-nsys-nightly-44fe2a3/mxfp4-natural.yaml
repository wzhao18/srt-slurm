name: "kimi-k3-mxfp4-dcp8-dspark4-natural-nightly44fe2a3-128k-nsys"

model:
  path: "${KIMI_K3_MXFP4_MODEL}"
  container: "vllm/vllm-openai:nightly-44fe2a392b71d52a8d72faf2f8278834379482c9"
  precision: "fp4"

identity:
  model:
    repo: "moonshotai/Kimi-K3"
    revision: "9f62e4e9fffbd0a83ddd60e1c209d828994b3569"
  container:
    image: "vllm/vllm-openai:nightly-44fe2a392b71d52a8d72faf2f8278834379482c9"
  frameworks:
    dynamo: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"

extra_mount:
  - "${KIMI_K3_DSPARK_MODEL}:/dspark-model"
  - "${NSYS_HOST_ROOT}:/opt/nsight-systems"

dynamo:
  hash: "ba83080ecd31c1ce918559e576d3c5bc9e092ff1"
  install: true
  request_plane: "tcp"

setup_script: "reproductions/kimi-k3-dcp8-nsys-nightly-44fe2a3/scripts/install-flashinfer-0.6.17-revert-pr54277.sh"

slurm:
  account: "coreai_comparch_inferencex"
  partition: "batch"
  time_limit: "04:00:00"

health_check:
  max_attempts: 720
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
  agg_nodes: 2
  agg_workers: 1
  gpus_per_agg: 8

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

frontend:
  type: "dynamo"
  enable_multiple_frontends: false
  args:
    router-mode: "random"
  env:
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
    DYN_TOKENIZER_CACHE_BYTES: "8589934592"

backend:
  type: "vllm"
  connector: null
  mooncake_kv_store:
    store_config:
      metadata_server: "P2PHANDSHAKE"
      global_segment_size: "150GB"
      local_buffer_size: "4GB"
      protocol: "rdma"
      device_name: "mlx5_8"
      mode: "embedded"
      enable_offload: false
  aggregated_environment:
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_RPC_TIMEOUT: "600000"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_MOONCAKE_LOAD_RECV_THREADS: "4"
    WITH_NVIDIA_PEERMEM: "0"
    VLLM_LOG_STATS_INTERVAL: "1"
  vllm_config:
    aggregated:
      kv-transfer-config: '{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_offload":false}}'
      served-model-name: "moonshotai/Kimi-K3"
      load-format: "fastsafetensors"
      kv-cache-dtype: "fp8"
      gpu-memory-utilization: 0.95
      tensor-parallel-size: 8
      decode-context-parallel-size: 8
      cp-kv-cache-interleave-size: 1
      trust-remote-code: true
      enable-flashinfer-autotune: true
      max-cudagraph-capture-size: 512
      stream-interval: 10
      language-model-only: true
      attention-backend: "TOKENSPEED_MLA"
      attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
      speculative-config: '{"model":"/dspark-model","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"rejection_sample_method":"synthetic","synthetic_acceptance_length":3.36}'
      enable-prefix-caching: true
      prefix-match-unit: 128

profiling:
  type: "nsys"
  extra_nsys_args:
    - "--sample=none"
    - "--cpuctxsw=none"
  aggregated:
    start_step: 0
    stop_step: 100

sbatch_directives:
  mem: "0"
  cpus-per-task: "72"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  type: "custom"
  command: "bash /configs/reproductions/kimi-k3-dcp8-nsys-nightly-44fe2a3/scripts/profile_decode.sh"
  env:
    PROFILE_OUTPUT_DIR: "/logs/profiles"
    PROFILE_ISL: "131072"
    PROFILE_OSL: "1024"
    PROFILE_REPLAY_OSL: "8192"
    PROFILE_CACHE_FILL_OSL: "1"
    PROFILE_CONCURRENCY: "64"
    PROFILE_NUM_PROMPTS: "64"
    PROFILE_SEED: "0"
    PROFILE_MODEL_NAME: "moonshotai/Kimi-K3"
    PROFILE_TOKENIZER_PATH: "/model"
