name: "kimi-k3-mxfp4-gb300-dcp8-agg-dspark4-sonnet-prefill-128k-plus48k-nsys"

model:
  path: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/models/kimi-k3-model"
  container: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/images/pytorch+25+12+py3.sqsh"
  precision: "fp4"

identity:
  model:
    repo: "moonshotai/Kimi-K3"
    revision: "9f62e4e9fffbd0a83ddd60e1c209d828994b3569"
  container:
    image: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/images/pytorch+25+12+py3.sqsh"
  frameworks:
    dynamo: "1.3.0"
    vllm: a01a50ae465fa7de64fa9c5ef34b5ced2f54dae2

extra_mount:
  - "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha:/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha"
  - "/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/models/kimi-k3-dspark-model:/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/models/kimi-k3-dspark-model"
  - "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm:/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm"
  - "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/InferenceX:/infmax-workspace"
  - "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/.cache/aiperf:/aiperf_mmap_cache"
  - "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/.cache/huggingface/hub:/hf_hub_cache"

dynamo:
  hash: "1.3.0"
  install: false

setup_script: "venv-mooncake-path.sh"

slurm:
  account: "coreai_comparch_inferencex"
  partition: "batch"
  time_limit: "04:00:00"

health_check:
  max_attempts: 720
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
  agg_nodes: 2
  agg_workers: 1
  gpus_per_agg: 8

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 32

frontend:
  type: dynamo
  enable_multiple_frontends: false
  args:
    router-mode: "least-loaded"
    router-session-affinity-ttl-secs: 900
  env:
    PATH: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv/bin:/usr/local/lib/python3.12/dist-packages/torch_tensorrt/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/mpi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ucx/bin:/opt/amazon/efa/bin:/opt/tensorrt/bin:/opt/mellanox/doca/tools/"
    VIRTUAL_ENV: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv"
    LD_LIBRARY_PATH: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv/lib/python3.12/site-packages/torch/lib:/usr/local/cuda/compat/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64"
    PYTHONPYCACHEPREFIX: "/tmp/vllm-pycache-kimi-k3"
    DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS: "3600"
    DYN_TOKENIZER_CACHE_BYTES: "8589934592"

backend:
  type: vllm
  connector: null
  mooncake_kv_store:
    master_extra_args:
      - "--default_kv_lease_ttl=60000"
      - "--eviction_high_watermark_ratio=0.95"
      - "--eviction_ratio=0.10"
    store_config:
      metadata_server: "P2PHANDSHAKE"
      global_segment_size: "160GB"
      local_buffer_size: "4GB"
      protocol: "rdma"
      device_name: "rdma_vf_rail0,rdma_vf_rail1,rdma_vf_rail2,rdma_vf_rail3"
      mode: "embedded"
      enable_offload: false
  aggregated_environment:
    PATH: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv/bin:/usr/local/lib/python3.12/dist-packages/torch_tensorrt/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/mpi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ucx/bin:/opt/amazon/efa/bin:/opt/tensorrt/bin:/opt/mellanox/doca/tools/"
    VIRTUAL_ENV: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv"
    LD_LIBRARY_PATH: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/.venv/lib/python3.12/site-packages/torch/lib:/usr/local/cuda/compat/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64"
    VLLM_ALLREDUCE_USE_FLASHINFER: "1"
    VLLM_USE_DIRECT_DCP_A2A: "1"
    VLLM_USE_DIRECT_DCP_Q_GATHER: "1"
    VLLM_USE_DIRECT_DCP_KV_GATHER: "1"
    ETCD_LEASE_TTL: "120"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    VLLM_RPC_TIMEOUT: "600000"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_USE_RUST_FRONTEND: "1"
    VLLM_MOONCAKE_LOAD_RECV_THREADS: "4"
    MC_SLICE_SIZE: "1048576"
    WITH_NVIDIA_PEERMEM: "0"
    MC_MAX_MR_SIZE: "4294967296"
    VLLM_LOG_STATS_INTERVAL: "1"

  vllm_config:
    aggregated:
      kv-transfer-config: '{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"load_async":true,"lookup_async":true,"enable_offload":false}}'
      served-model-name: "moonshotai/Kimi-K3"
      load-format: fastsafetensors
      kv-cache-dtype: fp8
      mamba-ssm-cache-dtype: bfloat16
      gpu-memory-utilization: 0.92
      tensor-parallel-size: 8
      decode-context-parallel-size: 8
      dcp-comm-backend: a2a
      trust-remote-code: true
      max-cudagraph-capture-size: 320
      max-num-seqs: 64
      max-num-batched-tokens: 16384
      enable-flashinfer-autotune: true
      stream-interval: 10
      language-model-only: true
      attention-backend: "TOKENSPEED_MLA"
      attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
      speculative-config: '{"model":"/scratch/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/models/kimi-k3-dspark-model","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":4,"rejection_sample_method":"synthetic","synthetic_acceptance_length":3.36}'
      enable-prefix-caching: true
      prefix-cache-retention-interval: 0
      prefix-match-unit: 128

profiling:
  type: nsys
  extra_nsys_args:
    - "--sample=none"
    - "--cpuctxsw=none"
  aggregated:
    start_step: 0
    # Stop after the extension completes; empty connector calls count as worker steps.
    stop_step: null

sbatch_directives:
  mem: "0"
  cpus-per-task: "72"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  type: custom
  command: "bash /configs/kimi-sonnet-prefill-profile.sh"
  env:
    PROFILE_OUTPUT_DIR: "/logs/profiles"
    PROFILE_ISL: "131072"
    PROFILE_EXTENSION_TOKENS: "49152"
    PROFILE_OSL: "1024"
    PROFILE_CACHE_FILL_OSL: "1"
    PROFILE_CONCURRENCY: "1"
    PROFILE_NUM_PROMPTS: "1"
    PROFILE_SEED: "0"
    PROFILE_DECODE_WINDOW_TIMEOUT: "1800"
    PROFILE_DATASET_NAME: "sonnet"
    PROFILE_TEXT_CORPUS_PATH: "/lustre/fsw/portfolios/coreai/projects/coreai_comparch_inferencex/users/weizha/vllm/srt-slurm/configs/shakespeare.txt"
    PROFILE_SONNET_PREFIX_LEN: "128"
    PROFILE_MODEL_NAME: "moonshotai/Kimi-K3"
    PROFILE_TOKENIZER_PATH: "/model"
